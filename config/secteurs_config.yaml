# ============================================================
# REFERENTIEL SECTORIEL - Ratios par secteur d'activite
# ============================================================
# Sources :
#   - INSEE (Esane 2023) : taux de marge par secteur
#   - Banque de France (FIBEN) : DSO, DPO, gearing, autonomie
#   - CreditSafe : delais de paiement sectoriels
#
# Pour chaque secteur :
#   - code_naf_prefix : prefixes NAF/APE correspondants
#   - ratios : mediane + quartiles (Q1, Q3) pour chaque ratio
#   - ratios_desactives : ratios non pertinents pour ce secteur
#     (exclus du scoring sectoriel)
#
# Les ratios couvrent les 6 categories : liquidite, endettement,
# rentabilite, croissance, gestion_activite, risque_solvabilite.
#
# UTILISATION :
#   Le scoring compare la valeur de l'entreprise
#   a la distribution sectorielle (Q1, mediane, Q3)
# ============================================================

