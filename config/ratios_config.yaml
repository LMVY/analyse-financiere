# ============================================================
# CONFIGURATION DES RATIOS FINANCIERS
# ============================================================
# Ce fichier centralise TOUS les parametres des ratios.
#
# POUR MODIFIER UN RATIO :
#   1. Changer "poids" (importance dans sa categorie, somme = 1.0)
#   2. Changer "seuils" (5 valeurs : tres mauvais -> tres bon)
#   3. Changer "sens" ("hausse_bien" ou "baisse_bien")
#   4. Changer "cible" (valeur ideale affichee)
#
# SOURCES OFFICIELLES UTILISEES :
#   - Bale III (BIS)          : liquidite, solvabilite, fonds propres
#   - Banque de France        : endettement, structure, ratios sectoriels
#   - INSEE (ESANE)           : rentabilite, croissance, gestion
#   - PCG / ANC               : conformite comptable
#   - Conan-Holder (1979)     : risque PME francaises
#   - Damodaran (NYU)         : rentabilite (comparaison internationale)
#   - IFRS / IAS 7            : flux de tresorerie
#   - Bessemer (SaaS)         : burn rate, runway
#
# DERNIERE MISE A JOUR : 2026
# ============================================================

