profils:
  tres_court_terme:
    label: Tres court terme
    description: 'Risque de paiement a moins d''un an : le cycle d''exploitation (delais clients/fournisseurs,
      BFR) est la premiere source ou la premiere consommatrice de tresorerie ; la charge d''interets pesant
      sur l''exercice en cours complete la lecture. La croissance est neutralisee (0).'
    poids_categories:
      croissance: 0.0
      rentabilite: 0.15
      gestion_activite: 0.45
      endettement: 0.25
      partage_valeur: 0.15
  court_terme:
    label: Court terme
    description: 'Capacite de remboursement a 1-3 ans : la structure et le cout de l''endettement priment,
      soutenus par la marge d''excedent brut de l''exercice et un cycle d''exploitation maitrise.'
    poids_categories:
      croissance: 0.1
      rentabilite: 0.2
      gestion_activite: 0.25
      endettement: 0.35
      partage_valeur: 0.1
  moyen_terme:
    label: Moyen terme
    description: 'Equilibre financier durable a 3-7 ans : la rentabilite (marges, rentabilite du capital
      d''exploitation) et la capacite de desendettement sont les deux piliers ; le partage de la valeur
      ajoutee (parts personnel, Etat, preteurs) revele la rigidite de la structure de charges.'
    poids_categories:
      croissance: 0.15
      rentabilite: 0.3
      gestion_activite: 0.1
      endettement: 0.3
      partage_valeur: 0.15
  long_terme:
    label: Long terme
    description: 'Creation de valeur et solvabilite a 7-15 ans : la rentabilite durable (dont le rendement
      du capital d''exploitation) et la trajectoire de croissance priment ; la structure du cycle d''exploitation,
      installee depuis longtemps, pese peu.'
    poids_categories:
      croissance: 0.25
      rentabilite: 0.35
      gestion_activite: 0.1
      endettement: 0.2
      partage_valeur: 0.1
